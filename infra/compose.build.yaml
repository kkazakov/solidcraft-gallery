# Build overlay used by the Ansible controller and by local development.
# The production host only consumes the prebuilt images from compose.yaml.
services:
  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        # SvelteKit bakes paths.origin into the build; it is what CSRF
        # compares form Origin headers against behind the TLS proxy.
        PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?PUBLIC_ORIGIN is required}

  worker:
    build:
      context: ..
      dockerfile: apps/worker/Dockerfile
