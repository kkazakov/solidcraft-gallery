---
- name: Bootstrap Python for Ansible
  hosts: all
  gather_facts: false
  become: false

  tasks:
    - name: Check whether Python 3 is available
      ansible.builtin.raw: command -v python3 || true
      register: gallery_python
      changed_when: false

    - name: Install Python 3 for Ansible
      ansible.builtin.raw: |
        set -eu
        if command -v apk >/dev/null 2>&1; then
          apk add --no-cache python3
        elif command -v apt-get >/dev/null 2>&1; then
          apt-get update
          apt-get install -y python3
        elif command -v dnf >/dev/null 2>&1; then
          dnf install -y python3
        else
          echo "Python 3 is required but no supported package manager was found" >&2
          exit 1
        fi
      when: gallery_python.stdout | trim == ''
      changed_when: true

- name: Deploy SolidCraft Gallery
  hosts: all
  gather_facts: true
  become: false

  vars:
    repo_root: "{{ (lookup('env', 'DEPLOY_REPO_ROOT') | default(playbook_dir ~ '/../..', true)) | realpath }}"
    env_file: "{{ lookup('env', 'DEPLOY_ENV_FILE') | default(repo_root ~ '/.env', true) }}"
    deploy_host: "{{ lookup('env', 'DEPLOY_HOST') | default('192.168.88.222', true) }}"
    deploy_dir: "{{ lookup('env', 'DEPLOY_DIR') | default('/opt/solidcraft-gallery', true) }}"
    web_port: "{{ lookup('env', 'WEB_PORT') | default('8080', true) }}"
    forgejo_port: "{{ lookup('env', 'FORGEJO_PORT') | default('8081', true) }}"
    web_domain: "{{ lookup('env', 'WEB_DOMAIN') | default('solidcraft.drun.net', true) }}"
    forgejo_domain: "{{ lookup('env', 'FORGEJO_DOMAIN') | default('forgejo.drun.net', true) }}"
    postgres_user: "{{ lookup('env', 'POSTGRES_USER') | default('gallery', true) }}"
    postgres_db: "{{ lookup('env', 'POSTGRES_DB') | default('gallery', true) }}"
    caddy_auto_https: "{{ lookup('env', 'CADDY_AUTO_HTTPS') | default('off', true) | lower }}"
    web_image: "{{ lookup('env', 'WEB_IMAGE') | default('gallery-web:local', true) }}"
    worker_image: "{{ lookup('env', 'WORKER_IMAGE') | default('gallery-worker:local', true) }}"
    deploy_env: "{{ lookup('env', 'DEPLOY_ENV') | default('dev', true) }}"
    solidcraft_cli_dir: "{{ lookup('env', 'SOLIDCRAFT_CLI_DIR') | default(deploy_dir ~ '/cli', true) }}"
    solidcraft_cli_auto_update: "{{ (lookup('env', 'SOLIDCRAFT_CLI_AUTO_UPDATE') | default('0', true)) == '1' }}"
    solidcraft_cli_update_hour: "{{ lookup('env', 'SOLIDCRAFT_CLI_UPDATE_HOUR') | default('2', true) }}"
    solidcraft_cli_update_minute: "{{ lookup('env', 'SOLIDCRAFT_CLI_UPDATE_MINUTE') | default('17', true) }}"
    solidcraft_release_repo: "{{ lookup('env', 'SOLIDCRAFT_RELEASE_REPO') | default('tangency-labs/solidcraft', true) }}"
    solidcraft_cli_keep_versions: "{{ lookup('env', 'SOLIDCRAFT_CLI_KEEP_VERSIONS') | default('5', true) }}"
    solidcraft_cli_prune_hours: "{{ lookup('env', 'SOLIDCRAFT_CLI_PRUNE_MIN_AGE_HOURS') | default('168', true) }}"
    keep_backups: "{{ lookup('env', 'DEPLOY_KEEP_BACKUPS') | default('5', true) | int }}"
    backup_before_deploy: "{{ (lookup('env', 'DEPLOY_BACKUP_BEFORE_DEPLOY') | default('1', true)) == '1' }}"
    forgejo_bootstrap_admin: "{{ (lookup('env', 'FORGEJO_BOOTSTRAP_ADMIN') | default('0', true)) == '1' }}"
    forgejo_admin_username: "{{ lookup('env', 'FORGEJO_ADMIN_USERNAME') | default('gallery-admin', true) }}"
    forgejo_admin_password: "{{ lookup('env', 'FORGEJO_ADMIN_PASSWORD') | default('', true) }}"
    forgejo_admin_email: "{{ lookup('env', 'FORGEJO_ADMIN_EMAIL') | default('admin@example.com', true) }}"
    image_archive: '{{ repo_root }}/.deploy/gallery-images.tar.gz'
    compose_files_args:
      - -f
      - '{{ deploy_dir }}/compose.yaml'
    compose_tls_args:
      - -f
      - '{{ deploy_dir }}/compose.tls.yaml'
    compose_env_args:
      - --env-file
      - '{{ deploy_dir }}/.env'
    compose_prefix: "{{ ['docker', 'compose'] + compose_files_args + (compose_tls_args if caddy_auto_https == 'on' else []) + compose_env_args }}"
    postgres_schema_args:
      - exec
      - -T
      - postgres
      - psql
      - --username
      - '{{ postgres_user }}'
      - --dbname
      - '{{ postgres_db }}'
      - --tuples-only
      - --no-align
      - --command
      - "select to_regclass('public.schema_migrations')"
    forgejo_admin_create_args:
      - exec
      - -T
      - -u
      - git
      - forgejo
      - forgejo
      - admin
      - user
      - create
      - --username
      - '{{ forgejo_admin_username }}'
      - --password
      - '{{ forgejo_admin_password }}'
      - --email
      - '{{ forgejo_admin_email }}'
      - --admin
      - --must-change-password=false

  pre_tasks:
    - name: Validate local deployment inputs
      ansible.builtin.assert:
        that:
          - deploy_dir is match('^/')
          - env_file is file
          - caddy_auto_https in ['on', 'off']
          - web_domain | length > 0
          - forgejo_domain | length > 0
          - deploy_env in ['dev', 'staging', 'prod']
          - solidcraft_cli_dir is match('^/')
          - solidcraft_cli_dir is match('^' ~ (deploy_dir | regex_escape) ~ '/')
          - solidcraft_cli_update_hour is match('^([01]?[0-9]|2[0-3])$')
          - solidcraft_cli_update_minute is match('^([0-5]?[0-9])$')
          - solidcraft_cli_keep_versions is match('^[0-9]+$')
          - solidcraft_cli_prune_hours is match('^[0-9]+$')
          - not (solidcraft_cli_auto_update | bool) or deploy_env == 'prod'
        fail_msg: 'Refusing to deploy: check .env (see .env.example) and run scripts/deploy.sh.'
        quiet: true

    - name: Check free disk space
      ansible.builtin.assert:
        that:
          - (ansible_mounts | selectattr('mount', 'equalto', '/') | map(attribute='size_available') | first | int) > 1610612736
        fail_msg: 'Less than 1.5 GiB free on /. Prune unused Docker data before deploying.'
        quiet: true

  roles:
    - docker
    - gallery
