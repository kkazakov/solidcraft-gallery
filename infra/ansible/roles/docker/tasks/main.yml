---
- name: Check the Docker CLI
  ansible.builtin.command:
    argv: [docker, --version]
  register: docker_cli_version
  changed_when: false
  failed_when: false

- name: Install Docker on Alpine when it is missing
  ansible.builtin.command:
    argv: [apk, add, --no-cache, docker, docker-cli-compose]
  when:
    - docker_cli_version.rc != 0
    - ansible_facts.os_family == 'Alpine'
  changed_when: true

- name: Start and enable Docker
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true
  when: docker_cli_version.rc != 0

- name: Re-check the Docker CLI after installation
  ansible.builtin.command:
    argv: [docker, --version]
  register: docker_cli_version_after
  changed_when: false
  failed_when: false
  when: docker_cli_version.rc != 0

- name: Remember whether Docker is available
  ansible.builtin.set_fact:
    docker_available: '{{ (docker_cli_version_after.rc | default(docker_cli_version.rc)) == 0 }}'

- name: Require Docker
  ansible.builtin.assert:
    that:
      - docker_available | bool
    fail_msg: 'Docker is required on the target host. Install Docker Engine and the Compose plugin, then retry.'
    quiet: true

- name: Check the Docker Compose plugin
  ansible.builtin.command:
    argv: [docker, compose, version]
  register: docker_compose_version
  changed_when: false
  failed_when: false

- name: Require the Docker Compose plugin
  ansible.builtin.assert:
    that:
      - docker_compose_version.rc == 0
    fail_msg: 'Docker Compose v2 is required (`docker compose version`). Install the Compose plugin.'
    quiet: true

- name: Check access to the Docker daemon
  ansible.builtin.command:
    argv: [docker, info]
  register: docker_daemon_info
  changed_when: false
  failed_when: false

- name: Require a running Docker daemon
  ansible.builtin.assert:
    that:
      - docker_daemon_info.rc == 0
    fail_msg: 'Docker is installed but the daemon is not reachable. Start it (for example `rc-service docker start`).'
    quiet: true
