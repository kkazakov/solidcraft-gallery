<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <script>
      (() => {
        const key = 'gallery-theme';
        const root = document.documentElement;
        const labels = { system: 'System', light: 'Light', dark: 'Dark' };
        const next = { system: 'light', light: 'dark', dark: 'system' };
        let stored = null;
        try {
          stored = localStorage.getItem(key);
        } catch {
          // Storage can be blocked; system preference still applies.
        }
        let mode = stored === 'light' || stored === 'dark' ? stored : 'system';
        if (mode !== 'system') root.dataset.theme = mode;

        const describe = () => `Theme: ${labels[mode]}. Switch to ${labels[next[mode]]}.`;

        function apply(value, persist) {
          mode = value;
          if (mode === 'system') {
            if (persist) {
              try {
                localStorage.removeItem(key);
              } catch {}
            }
            delete root.dataset.theme;
          } else {
            if (persist) {
              try {
                localStorage.setItem(key, mode);
              } catch {}
            }
            root.dataset.theme = mode;
          }

          const toggle = document.getElementById('theme-toggle');
          if (toggle) {
            toggle.dataset.mode = mode;
            toggle.setAttribute('aria-label', describe());
            toggle.title = describe();
          }
        }

        document.addEventListener('DOMContentLoaded', () => {
          const toggle = document.getElementById('theme-toggle');
          if (!toggle) return;
          apply(mode, false);
          toggle.addEventListener('click', () => apply(next[mode], true));
        });
      })();
    </script>
    <link rel="icon" href="%sveltekit.assets%/favicon.svg" />
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
    <!-- Progressive enhancement only; every form still works without JavaScript. -->
    <script>
      (() => {
        function sync(form) {
          const select = form.querySelector('[data-license-select]');
          const visibility = form.querySelector('[data-visibility-select]');
          if (!select || !visibility) return;
          const disabled = visibility.value === 'private';
          select.disabled = disabled;
          const field = select.closest('[data-license-field]');
          if (field) field.classList.toggle('is-disabled', disabled);
        }

        function init() {
          document.querySelectorAll('form[data-visibility-form]').forEach(sync);
        }

        document.addEventListener('change', (event) => {
          const target = event.target;
          if (!(target instanceof Element)) return;
          const form = target.closest('form[data-visibility-form]');
          if (form) sync(form);
        });
        init();
      })();
    </script>
  </body>
</html>
