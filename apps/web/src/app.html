<!doctype html>
<html lang="%lang%">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <script>
      // The language preference lives in localStorage; a cookie mirrors it so
      // the server can render the right language. If the cookie was cleared
      // but the local choice survived, restore it and reload once.
      (() => {
        // Keep the key and supported list in sync with lib/i18n/config.ts.
        const key = 'gallery-language';
        const supported = ['en', 'bg', 'fr', 'de', 'es'];
        let stored = null;
        try {
          stored = localStorage.getItem(key);
        } catch {
          return;
        }
        if (!stored || !supported.includes(stored) || stored === document.documentElement.lang) return;
        try {
          if (sessionStorage.getItem('gallery-language-sync') === '1') return;
          sessionStorage.setItem('gallery-language-sync', '1');
        } catch {
          return;
        }
        document.cookie = key + '=' + encodeURIComponent(stored) + '; path=/; max-age=31536000; samesite=lax';
        location.reload();
      })();
    </script>
    <script>
      (() => {
        const key = 'gallery-theme';
        const root = document.documentElement;
        const fallbackLabels = { system: 'System', light: 'Light', dark: 'Dark' };
        const fallbackTemplate = 'Theme: {mode}. Switch to {next}.';
        const next = { system: 'light', light: 'dark', dark: 'system' };
        let stored = null;
        try {
          stored = localStorage.getItem(key);
        } catch {
          // Storage can be blocked; system preference still applies.
        }
        let mode = stored === 'light' || stored === 'dark' ? stored : 'system';
        if (mode !== 'system') root.dataset.theme = mode;

        function toggleElement() {
          return document.getElementById('theme-toggle');
        }

        function describe() {
          const toggle = toggleElement();
          const labels = {
            system: toggle?.dataset.labelSystem || fallbackLabels.system,
            light: toggle?.dataset.labelLight || fallbackLabels.light,
            dark: toggle?.dataset.labelDark || fallbackLabels.dark,
          };
          const template = toggle?.dataset.labelTemplate || fallbackTemplate;
          return template.replaceAll('{mode}', labels[mode]).replaceAll('{next}', labels[next[mode]]);
        }

        function apply(value, persist) {
          mode = value;
          if (mode === 'system') {
            if (persist) {
              try {
                localStorage.removeItem(key);
              } catch {}
            }
            delete root.dataset.theme;
          } else {
            if (persist) {
              try {
                localStorage.setItem(key, mode);
              } catch {}
            }
            root.dataset.theme = mode;
          }

          const toggle = toggleElement();
          if (toggle) {
            toggle.dataset.mode = mode;
            toggle.setAttribute('aria-label', describe());
            toggle.title = describe();
          }
        }

        document.addEventListener('DOMContentLoaded', () => {
          const toggle = toggleElement();
          if (!toggle) return;
          apply(mode, false);
          toggle.addEventListener('click', () => apply(next[mode], true));
        });
      })();
    </script>
    <link rel="icon" href="%sveltekit.assets%/favicon.svg" />
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
    <!-- Progressive enhancement only; every form still works without JavaScript. -->
    <script>
      (() => {
        function sync(form) {
          const select = form.querySelector('[data-license-select]');
          const visibility = form.querySelector('[data-visibility-select]');
          if (!select || !visibility) return;
          const disabled = visibility.value === 'private';
          select.disabled = disabled;
          const field = select.closest('[data-license-field]');
          if (field) field.classList.toggle('is-disabled', disabled);
        }

        function init() {
          document.querySelectorAll('form[data-visibility-form]').forEach(sync);
        }

        document.addEventListener('change', (event) => {
          const target = event.target;
          if (!(target instanceof Element)) return;

          const languageForm = target.closest('form[data-language-form]');
          if (languageForm) {
            const select = languageForm.querySelector('select[name="language"]');
            if (select) {
              try {
                localStorage.setItem('gallery-language', select.value);
              } catch {}
            }
            if (typeof languageForm.requestSubmit === 'function') languageForm.requestSubmit();
            return;
          }

          const form = target.closest('form[data-visibility-form]');
          if (form) sync(form);
        });
        init();
      })();
    </script>
  </body>
</html>
